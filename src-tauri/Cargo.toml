[package]
name = "coding-tools-mcp"
version = "0.1.33"
description = "Headless Coding Tools MCP Gateway and Web Console for Linux and Windows"
authors = ["Coding Tools MCP Contributors"]
edition = "2021"
autobins = false

[lib]
name = "coding_tools_mcp"
crate-type = ["rlib"]

[[bin]]
name = "coding-tools"
path = "src/bin/coding-tools.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["form"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
regex = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
shlex = "1"
shell-words = "1"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
