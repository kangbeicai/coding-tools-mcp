[package]
name = "coding-tools-mcp"
version = "0.1.33"
description = "Linux Coding Tools MCP Gateway and Web Console"
authors = ["Coding Tools MCP Contributors"]
edition = "2021"
autobins = false

[lib]
name = "coding_tools_mcp"
crate-type = ["rlib"]

[[bin]]
name = "coding-tools"
path = "src/bin/coding-tools.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "process", "io-util", "fs", "time", "signal"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
walkdir = "2"
regex = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
shlex = "1"
shell-words = "1"
which = "7"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
