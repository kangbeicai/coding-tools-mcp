name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "static/**"
      - "src-tauri/**"
      - "svelte.config.js"
      - "vite.config.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish a GitHub Release; ref must be an existing v* tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref || 'push' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      tag: ${{ steps.mode.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve release mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_REF: ${{ inputs.ref }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false
          tag=""

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            publish=true
            tag="$REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            if [[ "$MANUAL_REF" != v* ]]; then
              echo "Manual publish requires ref to be an existing v* tag: $MANUAL_REF" >&2
              exit 1
            fi
            publish=true
            tag="$MANUAL_REF"
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build embedded Web Console
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: coding-tools-linux-x86_64
            binary: src-tauri/target/release/coding-tools
          - runner: ubuntu-24.04-arm
            asset: coding-tools-linux-aarch64
            binary: src-tauri/target/release/coding-tools
          - runner: windows-latest
            asset: coding-tools-windows-x86_64.exe
            binary: src-tauri/target/release/coding-tools.exe

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build embedded Web Console
        run: npm run build

      - name: Build release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin coding-tools

      - name: Package release binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.asset }}"
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - verify
      - build
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum coding-tools-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/coding-tools-* dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              dist/coding-tools-* \
              dist/SHA256SUMS \
              --verify-tag \
              --title "Coding Tools MCP $TAG" \
              --generate-notes
          fi
